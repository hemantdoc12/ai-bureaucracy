name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore logo images
        run: |
          python3 << 'PY'
          import base64, pathlib
          images = {
    "og.png": "",
    "apple-touch.png": "",
    "favicon-32.png": "",
    "favicon-16.png": "",
          }
          changed = False
          for name, b64 in images.items():
              data = base64.b64decode(b64)
              path = pathlib.Path("assets") / name
              if not path.exists() or path.read_bytes() != data:
                  path.write_bytes(data)
                  changed = True
          pathlib.Path("/tmp/images-changed").write_text("1" if changed else "0")
          print("changed", changed)
          PY
      - name: Commit restored images
        run: |
          if [ "$(cat /tmp/images-changed)" != "1" ]; then
            echo "images already correct"
            exit 0
          fi
          git config user.name "hemantdoc12"
          git config user.email "201385915+hemantdoc12@users.noreply.github.com"
          git add assets/og.png assets/apple-touch.png assets/favicon-32.png assets/favicon-16.png
          git commit -m "Restore logo images."
          git push
      - name: Turn on GitHub Pages from the repository root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "GET pages status ${code}"
          if [ "$code" = "200" ]; then
            echo "Pages is already on"
            cat /tmp/pages.json
            exit 0
          fi
          create=$(curl -s -o /tmp/create.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}')
          echo "POST pages status ${create}"
          cat /tmp/create.json
          echo
          if [ "$create" != "201" ] && [ "$create" != "409" ]; then
            exit 1
          fi
